<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播平台</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common/theme.css">
    <script src="../common/app-header.js"></script>
    <style>
        html, body { height: 100%; }
        body { overflow: hidden; }

        /* ===== Layout ===== */
        .layout {
            display: flex;
            height: calc(100vh - 64px);
        }

        /* ===== Left sidebar：其他直播中頻道 ===== */
        .sidebar-left {
            width: 250px;
            flex-shrink: 0;
            background: var(--bg-elevated);
            overflow-y: auto;
            border-right: 1px solid var(--border-subtle);
        }
        .sidebar-left h4 {
            padding: 16px 14px 8px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .channel-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            margin: 2px 8px;
            border-radius: var(--radius-md);
            text-decoration: none;
            color: var(--text-primary);
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .channel-item:hover { background: var(--border-subtle); }
        .channel-item.active { background: var(--bg-panel-alt); box-shadow: inset 0 0 0 1px var(--border-strong); }
        .channel-item .avatar {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--bg-panel); display: flex; align-items: center; justify-content: center;
            font-size: 18px; flex-shrink: 0; position: relative;
        }
        .channel-item .avatar .dot {
            position: absolute; bottom: -2px; right: -2px;
            width: 11px; height: 11px; border-radius: 50%;
            background: var(--live); border: 2px solid var(--bg-elevated);
        }
        .channel-item .meta { min-width: 0; flex: 1; }
        .channel-item .meta .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-item .meta .cat { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .channel-item .viewers { font-size: 12px; color: var(--accent-2); flex-shrink: 0; }
        #noChannels { padding: 14px; font-size: 13px; color: var(--text-muted); }

        /* ===== Main stage ===== */
        .main-stage {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            min-width: 0;
        }
        .player-wrap { background: #000; }
        video { width: 100%; max-height: 70vh; display: block; background: #000; }
        .stream-info {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-subtle);
        }
        .stream-info .title-row {
            display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
        }
        .stream-info .title-row h2 { font-size: 18px; font-weight: 700; }
        .live-tag {
            background: var(--live); color: white; font-size: 11px; font-weight: 700;
            letter-spacing: 0.4px;
            padding: 3px 9px; border-radius: 999px;
            box-shadow: 0 4px 12px -2px rgba(251, 58, 93, 0.6);
        }
        .stream-info .sub { font-size: 13px; color: var(--text-secondary); }
        #status { font-size: 13px; margin-top: 8px; color: var(--text-muted); }

        /* ===== Right sidebar：聊天室 ===== */
        .sidebar-right {
            width: 320px;
            flex-shrink: 0;
            background: var(--bg-elevated);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-subtle);
        }
        .chat-header {
            padding: 16px; font-size: 14px; font-weight: 700;
            border-bottom: 1px solid var(--border-subtle);
        }
        #chatMessages { flex: 1; overflow-y: auto; padding: 12px; }
        .msg { padding: 5px 0; font-size: 14px; word-break: break-word; color: var(--text-secondary); }
        .msg .user { color: var(--accent-2); font-weight: 600; }
        .msg .time { color: var(--text-muted); font-size: 12px; }
        .msg.system { color: var(--text-muted); font-style: italic; }
        .chat-input { display: flex; gap: 6px; padding: 12px; border-top: 1px solid var(--border-subtle); }
        .chat-input input {
            flex: 1; padding: 9px 12px; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
            background: var(--bg-panel); color: var(--text-primary); min-width: 0;
        }
        .chat-input input:focus { outline: none; border-color: var(--accent); }
        .chat-input input.nickname { flex: 0 0 70px; }
        .chat-input button {
            padding: 9px 16px; background: var(--gradient-accent);
            color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600;
        }
        .chat-input button:hover { filter: brightness(1.1); }
    </style>
</head>
<body>

    <div id="app-header"></div>

    <div class="layout">
        <!-- ===== Left sidebar：其他正在直播的清單 ===== -->
        <aside class="sidebar-left">
            <h4>正在直播</h4>
            <div id="channelList"></div>
            <p id="noChannels" style="display:none;">目前沒有其他直播</p>
        </aside>

        <!-- ===== Main：直播主畫面 ===== -->
        <main class="main-stage">
            <div class="player-wrap">
                <video id="videoPlayer" controls autoplay muted></video>
            </div>
            <div class="stream-info">
                <div class="title-row">
                    <span class="live-tag">LIVE</span>
                    <h2 id="roomTitle">房間 - </h2>
                </div>
                <div class="sub" id="roomStreamer"></div>
                <p id="status">⏳ 等待直播開始...</p>
            </div>
        </main>

        <!-- ===== Right sidebar：聊天室 ===== -->
        <aside class="sidebar-right">
            <div class="chat-header">💬 聊天室</div>
            <div id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="username" class="nickname" placeholder="暱稱" />
                <input type="text" id="messageInput" placeholder="輸入訊息..."
                       onkeypress="if(event.key==='Enter')sendMessage()" />
                <button onclick="sendMessage()">送出</button>
            </div>
        </aside>
    </div>

    <script>
        // ========== 設定 ==========
        const API = '/api';
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room') || 'room001';
        document.getElementById('roomTitle').textContent = '房間 - ' + roomId;
        renderAppHeader({ active: 'live', roomId });

        // ✅ 直接連 MediaMTX 的 HLS（不經過 WebFlux 代理）
        const MEDIA_MTX_HOST = 'localhost:8888';
        const hlsUrl = `http://${MEDIA_MTX_HOST}/${roomId}/index.m3u8`;

        // ========== 左側：其他正在直播的頻道清單 ==========
        async function loadChannelList() {
            const listEl = document.getElementById('channelList');
            const noneEl = document.getElementById('noChannels');
            try {
                const res = await fetch(`${API}/rooms`);
                const rooms = await res.json();

                if (rooms.length === 0) {
                    listEl.innerHTML = '';
                    noneEl.style.display = 'block';
                    return;
                }
                noneEl.style.display = 'none';

                listEl.innerHTML = rooms.map(room => `
                    <a class="channel-item ${room.roomId === roomId ? 'active' : ''}"
                       href="${API}/live/watch.html?room=${encodeURIComponent(room.roomId)}">
                        <span class="avatar">🔴<span class="dot"></span></span>
                        <span class="meta">
                            <div class="name">${escapeHtml(room.streamerName)}</div>
                            <div class="cat">${escapeHtml(room.title)}</div>
                        </span>
                        <span class="viewers">👀 ${room.viewerCount}</span>
                    </a>
                `).join('');

                // 更新目前房間的標題/主播資訊
                const current = rooms.find(r => r.roomId === roomId);
                if (current) {
                    document.getElementById('roomTitle').textContent = current.title;
                    document.getElementById('roomStreamer').textContent = '🎙 ' + current.streamerName;
                }
            } catch (e) {
                noneEl.textContent = '無法載入直播列表';
                noneEl.style.display = 'block';
            }
        }

        loadChannelList();
        setInterval(loadChannelList, 5000);

        // ========== HLS 播放器 ==========
        const video = document.getElementById('videoPlayer');
        const statusEl = document.getElementById('status');
        let hls = null;
        let retryTimer = null;

        function startHls() {
            if (!Hls.isSupported()) {
                // Safari 原生支援 HLS
                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = hlsUrl;
                    statusEl.textContent = '🔴 直播中 - ' + roomId;
                } else {
                    statusEl.textContent = '❌ 您的瀏覽器不支援 HLS 播放';
                }
                return;
            }

            // 銷毀舊的 HLS 實例
            if (hls) { hls.destroy(); }

            hls = new Hls({
                liveSyncDuration: 3,          // 與直播的同步延遲（秒）
                liveMaxLatencyDuration: 10,    // 最大允許延遲（秒）
                liveDurationInfinity: true,    // 直播模式（無限時長）
                manifestLoadingTimeOut: 5000,  // 載入 .m3u8 的超時時間
                manifestLoadingMaxRetry: 2,    // 最多重試次數
                levelLoadingTimeOut: 5000,
                fragLoadingTimeOut: 10000
            });

            hls.loadSource(hlsUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                statusEl.textContent = '🔴 直播中 - ' + roomId;
                video.play();
                clearTimeout(retryTimer);
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    statusEl.textContent = '⏳ 等待直播開始... (每 5 秒重試)';
                    hls.destroy();
                    hls = null;
                    retryTimer = setTimeout(startHls, 5000);
                }
            });
        }

        startHls();

        // ========== WebSocket 聊天室 ==========
        const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
        let ws = null;

        function addChatMessage(user, message, time, isSystem) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = isSystem ? 'msg system' : 'msg';

            if (isSystem) {
                div.textContent = message;
            } else {
                div.innerHTML =
                    `<span class="time">[${time}]</span> ` +
                    `<span class="user">${escapeHtml(user)}</span>: ` +
                    `${escapeHtml(message)}`;
            }

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function connectChat() {
            ws = new WebSocket(
                `${wsProtocol}://${location.host}/api/ws/chat?roomId=${roomId}`
            );

            ws.onopen = () => {
                addChatMessage('', '已連線到聊天室 ✅', '', true);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    addChatMessage(data.user, data.message, data.time, false);
                } catch (e) {
                    addChatMessage('', event.data, '', true);
                }
            };

            ws.onclose = () => {
                addChatMessage('', '聊天室斷線，3 秒後重連...', '', true);
                setTimeout(connectChat, 3000);
            };

            ws.onerror = () => {
                // onclose 會自動觸發重連
            };
        }

        connectChat();

        function sendMessage() {
            const userInput = document.getElementById('username');
            const msgInput = document.getElementById('messageInput');
            const user = userInput.value.trim() || '匿名';
            const message = msgInput.value.trim();

            if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({ user, message }));
            msgInput.value = '';
            msgInput.focus();
        }
    </script>

</body>
</html>
