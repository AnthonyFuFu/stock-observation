<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>直播列表</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common/theme.css">
    <script src="../common/app-header.js"></script>
    <style>
        .page { padding: 32px 24px; max-width: 1280px; margin: 0 auto; }
        h2 { font-size: 22px; font-weight: 700; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--bg-panel);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-primary);
            box-shadow: var(--shadow-soft);
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .card:hover { transform: translateY(-6px); border-color: var(--border-strong); box-shadow: var(--shadow-elevated); }

        .thumb {
            height: 145px;
            background: linear-gradient(135deg, var(--bg-panel-alt), var(--bg-elevated));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
            position: relative;
        }
        .live-badge {
            position: absolute;
            top: 10px; left: 10px;
            background: var(--live);
            color: white;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.4px;
            padding: 3px 9px;
            border-radius: 999px;
            box-shadow: 0 4px 12px -2px rgba(251, 58, 93, 0.6);
        }
        .viewer-badge {
            position: absolute;
            bottom: 10px; right: 10px;
            background: rgba(9, 10, 23, 0.7);
            backdrop-filter: blur(6px);
            color: white;
            font-size: 12px;
            padding: 3px 9px;
            border-radius: 999px;
        }

        .info { padding: 14px 16px; }
        .info .title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
        .info .streamer { font-size: 13px; color: var(--text-secondary); }

        #empty { text-align: center; color: var(--text-muted); margin-top: 80px; font-size: 15px; }
    </style>
</head>
<body>

    <div id="app-header"></div>

    <div class="page">
        <h2>📺 目前直播中</h2>
        <div class="grid" id="grid"></div>
        <p id="empty" style="display:none;">目前沒有直播中的房間</p>
    </div>

    <script>
        renderAppHeader({ active: 'live' });

        const API = '/api';
        const grid = document.getElementById('grid');
        const emptyEl = document.getElementById('empty');

        function timeSince(startedAt) {
            const start = new Date(startedAt);
            const minutes = Math.max(0, Math.floor((Date.now() - start.getTime()) / 60000));
            if (minutes < 60) return `${minutes} 分鐘前開播`;
            return `${Math.floor(minutes / 60)} 小時 ${minutes % 60} 分鐘前開播`;
        }

        function render(rooms) {
            grid.innerHTML = '';
            emptyEl.style.display = rooms.length === 0 ? 'block' : 'none';

            for (const room of rooms) {
                const card = document.createElement('a');
                card.className = 'card';
                card.href = `${API}/live/watch.html?room=${encodeURIComponent(room.roomId)}`;
                card.innerHTML = `
                    <div class="thumb">
                        🔴
                        <span class="live-badge">LIVE</span>
                        <span class="viewer-badge">👀 ${room.viewerCount}</span>
                    </div>
                    <div class="info">
                        <div class="title">${room.title}</div>
                        <div class="streamer">🎙 ${room.streamerName} · ${timeSince(room.startedAt)}</div>
                    </div>
                `;
                grid.appendChild(card);
            }
        }

        async function loadRooms() {
            try {
                const res = await fetch(`${API}/rooms`);
                const rooms = await res.json();
                render(rooms);
            } catch (e) {
                emptyEl.textContent = '無法載入直播列表';
                emptyEl.style.display = 'block';
            }
        }

        loadRooms();
        setInterval(loadRooms, 5000);
    </script>

</body>
</html>
