<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>開始直播</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../common/theme.css">
    <script src="../common/mediamtx-publisher.js"></script>
    <script src="../common/app-header.js"></script>
    <style>
        .page-body { padding: 24px; }

        .container { display: flex; gap: 24px; max-width: 1200px; margin: auto; flex-wrap: wrap; }

        .preview { flex: 3; min-width: 320px; }
        video {
            width: 100%; border-radius: var(--radius-lg); background: #000;
            box-shadow: var(--shadow-elevated);
        }
        #status { font-size: 15px; margin-top: 12px; color: var(--text-secondary); }
        #status.live { color: #34d399; }
        #status.error { color: var(--live); }

        .panel {
            flex: 1; min-width: 260px;
            background: var(--bg-panel); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg); padding: 20px;
            box-shadow: var(--shadow-soft);
        }
        .panel h3 { margin-bottom: 16px; font-size: 16px; font-weight: 700; }
        .field { margin-bottom: 14px; }
        .field label { display: block; font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; }
        .field input[type="text"] {
            width: 100%; padding: 10px 12px; border: 1px solid var(--border-subtle); border-radius: var(--radius-sm);
            background: var(--bg-elevated); color: var(--text-primary);
        }
        .field input[type="text"]:focus { outline: none; border-color: var(--accent); }
        .source-options { display: flex; gap: 12px; margin-bottom: 14px; }
        .source-options label { display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; color: var(--text-secondary); }
        .mic-option { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-bottom: 18px; cursor: pointer; color: var(--text-secondary); }

        button {
            width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm); cursor: pointer;
            font-size: 15px; font-weight: 700; margin-bottom: 8px; transition: filter 0.15s ease, box-shadow 0.15s ease;
        }
        #startBtn { background: var(--gradient-accent); color: white; box-shadow: 0 8px 20px -6px rgba(108, 92, 231, 0.55); }
        #startBtn:hover:not(:disabled) { filter: brightness(1.08); }
        #stopBtn { background: var(--bg-elevated); color: var(--text-primary); border: 1px solid var(--border-subtle); }
        #stopBtn:hover:not(:disabled) { background: var(--bg-panel-alt); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        a.view-link { display: block; text-align: center; color: var(--accent-2); font-size: 13px; margin-top: 10px; text-decoration: none; }
        a.view-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div id="app-header"></div>

    <div class="page-body">
    <div class="container">
        <div class="preview">
            <video id="localVideo" muted autoplay playsinline></video>
            <p id="status">⏳ 尚未開始直播</p>
        </div>

        <div class="panel">
            <h3>直播設定</h3>
            <div class="field">
                <label for="roomId">房間 ID</label>
                <input type="text" id="roomId" />
            </div>
            <div class="field">
                <label for="title">直播標題</label>
                <input type="text" id="title" placeholder="我的直播" />
            </div>
            <div class="field">
                <label for="streamer">主播暱稱</label>
                <input type="text" id="streamer" placeholder="匿名主播" />
            </div>

            <div class="source-options">
                <label><input type="radio" name="source" value="screen" checked /> 🖥️ 螢幕分享</label>
                <label><input type="radio" name="source" value="camera" /> 📷 攝影機</label>
            </div>
            <label class="mic-option"><input type="checkbox" id="micEnabled" checked /> 🎤 加入麥克風聲音</label>

            <button id="startBtn" onclick="startBroadcast()">🔴 開始直播</button>
            <button id="stopBtn" onclick="stopBroadcast()" disabled>⏹ 停止直播</button>

            <a class="view-link" id="viewLink" href="#" target="_blank">👀 前往觀看頁面</a>
        </div>
    </div>
    </div>

    <script>
        renderAppHeader({ active: 'broadcast' });

        const API = '/api';

        // ✅ 直接對 MediaMTX 的 WebRTC(WHIP) 埠推流，不經過 WebFlux 代理
        const MEDIA_MTX_HOST = location.hostname;
        const WHIP_PORT = 8889;

        const params = new URLSearchParams(window.location.search);
        document.getElementById('roomId').value = params.get('room') || ('room' + Date.now().toString().slice(-6));

        const localVideo = document.getElementById('localVideo');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const viewLink = document.getElementById('viewLink');

        let publisher = null;
        let localStream = null;
        let currentRoomId = null;

        function setStatus(text, cls) {
            statusEl.textContent = text;
            statusEl.className = cls || '';
        }

        async function captureStream(source, micEnabled) {
            let stream;
            if (source === 'screen') {
                stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                if (micEnabled) {
                    const mic = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mic.getAudioTracks().forEach(track => stream.addTrack(track));
                }
            } else {
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: micEnabled });
            }
            return stream;
        }

        async function startBroadcast() {
            const roomId = document.getElementById('roomId').value.trim();
            const title = document.getElementById('title').value.trim() || '我的直播';
            const streamer = document.getElementById('streamer').value.trim() || '匿名主播';
            const source = document.querySelector('input[name="source"]:checked').value;
            const micEnabled = document.getElementById('micEnabled').checked;

            if (!roomId) {
                setStatus('❌ 請輸入房間 ID', 'error');
                return;
            }

            startBtn.disabled = true;
            setStatus('⏳ 正在取得畫面來源...');

            try {
                localStream = await captureStream(source, micEnabled);
                localVideo.srcObject = localStream;

                // 使用者透過瀏覽器分享畫面時手動停止分享，需同步結束直播
                localStream.getVideoTracks()[0].addEventListener('ended', stopBroadcast);

                setStatus('⏳ 正在建立推流連線...');
                const whipUrl = `http://${MEDIA_MTX_HOST}:${WHIP_PORT}/${roomId}/whip`;

                await new Promise((resolve, reject) => {
                    let connected = false;
                    publisher = new MediaMTXWebRTCPublisher({
                        url: whipUrl,
                        stream: localStream,
                        // MediaMTX 的 HLS 輸出只支援 H264/H265/AV1，VP8 無法轉出 HLS 畫面
                        videoCodec: 'h264',
                        videoBitrate: 2500,
                        audioCodec: 'opus',
                        audioBitrate: 64,
                        audioVoice: false,
                        onConnected: () => { connected = true; resolve(); },
                        onError: (err) => {
                            if (!connected) { reject(new Error(err)); }
                            else { setStatus('⚠️ ' + err, 'error'); }
                        },
                    });
                });

                // 同步將房間資訊寫入後端，供觀看頁面 / 房間列表顯示
                const roomParams = new URLSearchParams({ roomId, title, streamer });
                await fetch(`${API}/rooms?${roomParams}`, { method: 'POST' });

                currentRoomId = roomId;
                viewLink.href = `${API}/live/watch.html?room=${encodeURIComponent(roomId)}`;
                setStatus('🔴 直播中 - ' + roomId, 'live');
                stopBtn.disabled = false;
            } catch (err) {
                setStatus('❌ ' + (err.message || err), 'error');
                await cleanup();
                startBtn.disabled = false;
            }
        }

        async function stopBroadcast() {
            stopBtn.disabled = true;
            setStatus('⏳ 正在結束直播...');
            await cleanup();
            if (currentRoomId) {
                try { await fetch(`${API}/rooms/${encodeURIComponent(currentRoomId)}`, { method: 'DELETE' }); } catch (e) {}
            }
            currentRoomId = null;
            setStatus('⏹ 直播已結束');
            startBtn.disabled = false;
        }

        async function cleanup() {
            if (publisher) { publisher.close(); publisher = null; }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            localVideo.srcObject = null;
        }

        window.addEventListener('beforeunload', () => { if (currentRoomId) cleanup(); });
    </script>

</body>
</html>
