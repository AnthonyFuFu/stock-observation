<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>影片後台管理 - Stock Observation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../common/tailwind-theme.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: radial-gradient(circle at 18% -10%, #1c2046 0%, #090a17 55%) fixed; }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: #12142a; }
    ::-webkit-scrollbar-thumb { background: #383b58; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #6c5ce7; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // ── 常數 ─────────────────────────────────────────────
    const API = '/api';

    // ── 工具 ─────────────────────────────────────────────
    const fmtSize = bytes => {
      if (!bytes) return '--';
      const mb = bytes / (1024 * 1024);
      return mb >= 1024 ? `${(mb / 1024).toFixed(2)} GB` : `${mb.toFixed(1)} MB`;
    };

    const emptyForm = { title: '', description: '', category: '', tags: '', releaseDate: '' };

    // ── UploadForm：上傳影片並同時寫入資料庫 ──────────────
    const UploadForm = ({ onUploaded }) => {
      const [file, setFile]         = useState(null);
      const [form, setForm]         = useState(emptyForm);
      const [submitting, setSubmitting] = useState(false);
      const [message, setMessage]   = useState(null);

      const handleChange = e => {
        const { name, value } = e.target;
        setForm(prev => ({ ...prev, [name]: value }));
      };

      const handleSubmit = async e => {
        e.preventDefault();
        if (!file) {
          setMessage({ type: 'error', text: '請先選擇要上傳的影片檔案' });
          return;
        }
        setSubmitting(true);
        setMessage(null);
        try {
          const body = new FormData();
          body.append('file', file);
          body.append('title', form.title);
          body.append('description', form.description);
          body.append('category', form.category);
          body.append('tags', form.tags);
          body.append('releaseDate', form.releaseDate);

          const res = await fetch(`${API}/video/admin/upload`, { method: 'POST', body });
          if (!res.ok) throw new Error(await res.text());
          const video = await res.json();

          setMessage({ type: 'success', text: `上傳成功：${video.title}` });
          setForm(emptyForm);
          setFile(null);
          e.target.reset();
          onUploaded();
        } catch (err) {
          setMessage({ type: 'error', text: `上傳失敗：${err.message || err}` });
        } finally {
          setSubmitting(false);
        }
      };

      return (
        <form onSubmit={handleSubmit} className="bg-slate-800 border border-slate-700 rounded-xl p-6 space-y-4">
          <h2 className="text-lg font-bold text-slate-100">📤 上傳新影片</h2>

          <div>
            <label className="block text-slate-400 text-sm mb-1">影片檔案</label>
            <input
              type="file"
              accept="video/*"
              onChange={e => setFile(e.target.files?.[0] || null)}
              className="w-full text-sm text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-red-600 file:text-white file:cursor-pointer hover:file:bg-red-500 bg-slate-700/60 border border-slate-600 rounded-lg"
            />
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label className="block text-slate-400 text-sm mb-1">標題</label>
              <input name="title" value={form.title} onChange={handleChange}
                className="w-full bg-slate-700/60 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500" />
            </div>
            <div>
              <label className="block text-slate-400 text-sm mb-1">分類</label>
              <input name="category" value={form.category} onChange={handleChange} placeholder="未分類"
                className="w-full bg-slate-700/60 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500" />
            </div>
            <div>
              <label className="block text-slate-400 text-sm mb-1">標籤（以逗號分隔）</label>
              <input name="tags" value={form.tags} onChange={handleChange} placeholder="標籤1, 標籤2"
                className="w-full bg-slate-700/60 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500" />
            </div>
            <div>
              <label className="block text-slate-400 text-sm mb-1">發布日期</label>
              <input type="date" name="releaseDate" value={form.releaseDate} onChange={handleChange}
                className="w-full bg-slate-700/60 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500" />
            </div>
          </div>

          <div>
            <label className="block text-slate-400 text-sm mb-1">描述</label>
            <textarea name="description" value={form.description} onChange={handleChange} rows="3"
              className="w-full bg-slate-700/60 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-red-500 resize-none" />
          </div>

          {message && (
            <div className={`text-sm rounded-lg px-3 py-2 ${message.type === 'error' ? 'bg-red-900/40 text-red-300 border border-red-800' : 'bg-emerald-900/40 text-emerald-300 border border-emerald-800'}`}>
              {message.text}
            </div>
          )}

          <button type="submit" disabled={submitting}
            className="bg-red-600 hover:bg-red-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium rounded-lg px-5 py-2.5 text-sm transition-colors">
            {submitting ? '上傳中...' : '上傳影片'}
          </button>
        </form>
      );
    };

    // ── VideoRow：清單中單一影片列，含刪除按鈕 ─────────────
    const VideoRow = ({ video, onDeleted }) => {
      const [deleting, setDeleting] = useState(false);

      const handleDelete = async () => {
        if (!window.confirm(`確定要刪除「${video.title}」嗎？此操作無法復原。`)) return;
        setDeleting(true);
        try {
          const res = await fetch(`${API}/video/admin/${encodeURIComponent(video.filename)}`, { method: 'DELETE' });
          if (!res.ok) throw new Error(await res.text());
          onDeleted();
        } catch (err) {
          alert(`刪除失敗：${err.message || err}`);
        } finally {
          setDeleting(false);
        }
      };

      return (
        <tr className="border-b border-slate-800 hover:bg-slate-800/50">
          <td className="px-4 py-3 text-slate-100">{video.title}</td>
          <td className="px-4 py-3 text-slate-400">{video.category}</td>
          <td className="px-4 py-3 text-slate-400 text-xs">{(video.tags || []).join(', ')}</td>
          <td className="px-4 py-3 text-slate-400">{video.releaseDate || '--'}</td>
          <td className="px-4 py-3 text-slate-400">{fmtSize(video.sizeBytes)}</td>
          <td className="px-4 py-3 text-right">
            <button onClick={handleDelete} disabled={deleting}
              className="text-red-400 hover:text-red-300 disabled:opacity-50 text-sm transition-colors">
              {deleting ? '刪除中...' : '刪除'}
            </button>
          </td>
        </tr>
      );
    };

    // ── App ───────────────────────────────────────────────
    const App = () => {
      const [videos, setVideos] = useState([]);
      const [status, setStatus] = useState('loading');

      const loadVideos = useCallback(() => {
        setStatus('loading');
        fetch(`${API}/video/list`)
          .then(r => { if (!r.ok) throw new Error('load failed'); return r.json(); })
          .then(data => { setVideos(data || []); setStatus('idle'); })
          .catch(() => setStatus('error'));
      }, []);

      useEffect(() => { loadVideos(); }, [loadVideos]);

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
          {/* Header */}
          <header className="border-b border-slate-800 px-6 py-4 sticky top-0 bg-slate-900/95 backdrop-blur z-30">
            <div className="max-w-5xl mx-auto flex flex-wrap items-center gap-4">
              <div className="flex items-center gap-3 shrink-0">
                <span className="text-2xl">⚙️</span>
                <div>
                  <h1 className="font-bold text-slate-100 leading-tight">影片後台管理</h1>
                  <p className="text-slate-500 text-xs">Video Admin</p>
                </div>
              </div>
              <div className="flex-1"></div>
              <a href={`${API}/video/video.html`} className="text-slate-400 hover:text-slate-200 text-sm transition-colors shrink-0">🎬 影片庫</a>
              <a href={`${API}/index.html`} className="text-slate-400 hover:text-slate-200 text-sm transition-colors shrink-0">📈 股票儀表板</a>
            </div>
          </header>

          {/* Main */}
          <main className="max-w-5xl w-full mx-auto px-4 py-6 flex-1 space-y-6">
            <UploadForm onUploaded={loadVideos} />

            <div className="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden">
              <div className="px-6 py-4 border-b border-slate-700">
                <h2 className="text-lg font-bold text-slate-100">📋 影片清單（共 {videos.length} 部）</h2>
              </div>

              {status === 'loading' && (
                <div className="flex items-center justify-center h-32">
                  <div className="w-8 h-8 border-2 border-slate-600 border-t-red-500 rounded-full animate-spin"></div>
                </div>
              )}
              {status === 'error' && (
                <div className="text-center text-slate-500 py-10">⚠ 無法載入影片清單，請確認後端服務是否啟動</div>
              )}
              {status === 'idle' && videos.length === 0 && (
                <div className="text-center text-slate-500 py-10">尚無影片，請於上方上傳</div>
              )}
              {status === 'idle' && videos.length > 0 && (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead>
                      <tr className="text-left text-slate-500 text-xs uppercase border-b border-slate-700">
                        <th className="px-4 py-2 font-medium">標題</th>
                        <th className="px-4 py-2 font-medium">分類</th>
                        <th className="px-4 py-2 font-medium">標籤</th>
                        <th className="px-4 py-2 font-medium">發布日期</th>
                        <th className="px-4 py-2 font-medium">檔案大小</th>
                        <th className="px-4 py-2 font-medium text-right">操作</th>
                      </tr>
                    </thead>
                    <tbody>
                      {videos.map(v => (
                        <VideoRow key={v.filename} video={v} onDeleted={loadVideos} />
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800 px-6 py-3 text-center text-slate-600 text-xs">
            上傳的影片會同時寫入資料庫與伺服器儲存空間，儲存路徑由後端 app.video.upload-dir 設定
          </footer>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
