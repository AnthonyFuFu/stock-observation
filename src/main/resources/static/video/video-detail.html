<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>影片播放 - Stock Observation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../common/tailwind-theme.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background: radial-gradient(circle at 18% -10%, #1c2046 0%, #090a17 55%) fixed; }
    ::-webkit-scrollbar { height: 8px; width: 8px; }
    ::-webkit-scrollbar-track { background: #12142a; }
    ::-webkit-scrollbar-thumb { background: #383b58; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #6c5ce7; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ── 常數 ─────────────────────────────────────────────
    const API = '/api';
    const FILE = new URLSearchParams(window.location.search).get('file') || '';
    const goDetail = filename => { window.location.href = `${API}/video/video-detail.html?file=${encodeURIComponent(filename)}`; };
    const goList   = () => { window.location.href = `${API}/video/video.html`; };

    // ── 工具 ─────────────────────────────────────────────
    const fmtSize = bytes => {
      if (!bytes) return '--';
      const mb = bytes / (1024 * 1024);
      return mb >= 1024 ? `${(mb / 1024).toFixed(2)} GB` : `${mb.toFixed(1)} MB`;
    };

    // ── RelatedCard（下方推薦影片，簡化版卡片）──────────────
    const RelatedCard = ({ video }) => (
      <div onClick={() => goDetail(video.filename)}
        className="cursor-pointer w-52 shrink-0 select-none group">
        <div className="aspect-video rounded-lg overflow-hidden bg-slate-800 border border-slate-700 group-hover:border-red-500 transition-all flex items-center justify-center">
          <span className="text-3xl opacity-60">🎬</span>
        </div>
        <p className="mt-2 text-sm font-medium text-slate-200 truncate">{video.title}</p>
        <p className="text-xs text-slate-500 truncate">{video.category}</p>
      </div>
    );

    // ── App ───────────────────────────────────────────────
    const App = () => {
      const [video, setVideo]     = useState(null);
      const [related, setRelated] = useState([]);
      const [status, setStatus]   = useState('loading');

      useEffect(() => {
        if (!FILE) { setStatus('notfound'); return; }
        fetch(`${API}/video/info/${encodeURIComponent(FILE)}`)
          .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
          .then(data => { setVideo(data); setStatus('idle'); })
          .catch(() => setStatus('notfound'));

        fetch(`${API}/video/list`)
          .then(r => r.json())
          .then(list => setRelated((list || []).filter(v => v.filename !== FILE)))
          .catch(() => {});
      }, []);

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 flex flex-col">
          {/* Header */}
          <header className="border-b border-slate-800 px-6 py-4">
            <div className="max-w-6xl mx-auto flex items-center gap-4">
              <button onClick={goList} className="text-slate-400 hover:text-slate-200 text-sm transition-colors">← 返回影片庫</button>
            </div>
          </header>

          {/* Main */}
          <main className="max-w-6xl w-full mx-auto px-4 py-6 flex-1">
            {status === 'loading' && (
              <div className="flex items-center justify-center h-64">
                <div className="w-8 h-8 border-2 border-slate-600 border-t-red-500 rounded-full animate-spin"></div>
              </div>
            )}
            {status === 'notfound' && (
              <div className="text-center text-slate-500 py-20">⚠ 找不到這部影片</div>
            )}
            {status === 'idle' && video && (
              <>
                <div className="rounded-xl overflow-hidden bg-black border border-slate-800 mb-5">
                  <video
                    src={video.videoUrl}
                    controls
                    autoPlay
                    className="w-full max-h-[70vh] bg-black"
                  />
                </div>

                <section className="bg-slate-800 border border-slate-700 rounded-xl p-5 mb-8">
                  <div className="flex flex-wrap items-start justify-between gap-3 mb-2">
                    <h1 className="text-xl font-bold text-slate-100">{video.title}</h1>
                    <span className="text-xs px-2.5 py-1 rounded-lg bg-red-900/30 border border-red-800/50 text-red-400 shrink-0">
                      {video.category}
                    </span>
                  </div>
                  <p className="text-slate-400 text-sm leading-relaxed mb-4">
                    {video.description || '（尚無介紹）'}
                  </p>
                  <div className="flex flex-wrap gap-2 mb-4">
                    {(video.tags || []).map(tag => (
                      <span key={tag} className="text-xs px-2 py-1 rounded-md bg-slate-700 text-slate-300">#{tag}</span>
                    ))}
                  </div>
                  <div className="flex flex-wrap gap-x-6 gap-y-1 text-xs text-slate-500">
                    <span>檔名：{video.filename}</span>
                    <span>大小：{fmtSize(video.sizeBytes)}</span>
                    {video.releaseDate && <span>發布日期：{video.releaseDate}</span>}
                  </div>
                </section>

                {related.length > 0 && (
                  <section>
                    <h2 className="text-slate-400 text-xs font-semibold uppercase tracking-widest mb-3">更多影片</h2>
                    <div className="flex gap-4 overflow-x-auto pb-2">
                      {related.map(v => <RelatedCard key={v.filename} video={v} />)}
                    </div>
                  </section>
                )}
              </>
            )}
          </main>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
