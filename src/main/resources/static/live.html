<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>直播平台</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: white; padding: 20px; }
        h1 { color: #e94560; margin-bottom: 20px; }

        .container { display: flex; gap: 20px; max-width: 1200px; margin: auto; }

        /* 播放器 */
        .player { flex: 3; }
        video { width: 100%; border-radius: 8px; background: black; }
        #status { font-size: 18px; margin-top: 10px; }

        /* 聊天室 */
        .chat {
            flex: 1; display: flex; flex-direction: column;
            background: #16213e; border-radius: 8px; padding: 10px; height: 500px;
        }
        .chat h3 { margin-bottom: 10px; }
        #chatMessages { flex: 1; overflow-y: auto; margin-bottom: 10px; }
        .msg { padding: 4px 0; border-bottom: 1px solid #1a1a2e; font-size: 14px; }
        .msg .user { color: #e94560; font-weight: bold; }
        .msg .time { color: #666; font-size: 12px; }
        .chat-input { display: flex; gap: 5px; }
        .chat-input input { flex: 1; padding: 8px; border: none; border-radius: 4px; }
        .chat-input input.nickname { flex: 0.4; }
        .chat-input button {
            padding: 8px 16px; background: #e94560;
            color: white; border: none; border-radius: 4px; cursor: pointer;
        }
        .chat-input button:hover { background: #c73e54; }

        /* 系統訊息 */
        .msg.system { color: #888; font-style: italic; }
    </style>
</head>
<body>

    <h1>🔴 直播平台</h1>

    <div class="container">
        <!-- 播放器區域 -->
        <div class="player">
            <video id="videoPlayer" controls autoplay muted></video>
            <p id="status">⏳ 等待直播開始...</p>
        </div>

        <!-- 聊天室區域 -->
        <div class="chat">
            <h3>💬 聊天室</h3>
            <div id="chatMessages"></div>
            <div class="chat-input">
                <input type="text" id="username" class="nickname" placeholder="暱稱" />
                <input type="text" id="messageInput" placeholder="輸入訊息..."
                       onkeypress="if(event.key==='Enter')sendMessage()" />
                <button onclick="sendMessage()">送出</button>
            </div>
        </div>
    </div>

    <script>
        // ========== 設定 ==========
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room') || 'room001';

        // ✅ 直接連 MediaMTX 的 HLS（不經過 WebFlux 代理）
        const MEDIA_MTX_HOST = 'localhost:8888';
        const hlsUrl = `http://${MEDIA_MTX_HOST}/${roomId}/index.m3u8`;

        // ========== HLS 播放器 ==========
        const video = document.getElementById('videoPlayer');
        const statusEl = document.getElementById('status');
        let hls = null;
        let retryTimer = null;

        function startHls() {
            if (!Hls.isSupported()) {
                // Safari 原生支援 HLS
                if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = hlsUrl;
                    statusEl.textContent = '🔴 直播中 - ' + roomId;
                } else {
                    statusEl.textContent = '❌ 您的瀏覽器不支援 HLS 播放';
                }
                return;
            }

            // 銷毀舊的 HLS 實例
            if (hls) { hls.destroy(); }

            hls = new Hls({
                liveSyncDuration: 3,          // 與直播的同步延遲（秒）
                liveMaxLatencyDuration: 10,    // 最大允許延遲（秒）
                liveDurationInfinity: true,    // 直播模式（無限時長）
                manifestLoadingTimeOut: 5000,  // 載入 .m3u8 的超時時間
                manifestLoadingMaxRetry: 2,    // 最多重試次數
                levelLoadingTimeOut: 5000,
                fragLoadingTimeOut: 10000
            });

            hls.loadSource(hlsUrl);
            hls.attachMedia(video);

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                statusEl.textContent = '🔴 直播中 - ' + roomId;
                video.play();
                clearTimeout(retryTimer);
            });

            hls.on(Hls.Events.ERROR, (event, data) => {
                if (data.fatal) {
                    statusEl.textContent = '⏳ 等待直播開始... (每 5 秒重試)';
                    hls.destroy();
                    hls = null;
                    retryTimer = setTimeout(startHls, 5000);
                }
            });
        }

        startHls();

        // ========== WebSocket 聊天室 ==========
        const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
        let ws = null;

        function addChatMessage(user, message, time, isSystem) {
            const container = document.getElementById('chatMessages');
            const div = document.createElement('div');
            div.className = isSystem ? 'msg system' : 'msg';

            if (isSystem) {
                div.textContent = message;
            } else {
                div.innerHTML =
                    `<span class="time">[${time}]</span> ` +
                    `<span class="user">${escapeHtml(user)}</span>: ` +
                    `${escapeHtml(message)}`;
            }

            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function connectChat() {
            ws = new WebSocket(
                `${wsProtocol}://${location.host}/api/ws/chat?roomId=${roomId}`
            );

            ws.onopen = () => {
                addChatMessage('', '已連線到聊天室 ✅', '', true);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    addChatMessage(data.user, data.message, data.time, false);
                } catch (e) {
                    addChatMessage('', event.data, '', true);
                }
            };

            ws.onclose = () => {
                addChatMessage('', '聊天室斷線，3 秒後重連...', '', true);
                setTimeout(connectChat, 3000);
            };

            ws.onerror = () => {
                // onclose 會自動觸發重連
            };
        }

        connectChat();

        function sendMessage() {
            const userInput = document.getElementById('username');
            const msgInput = document.getElementById('messageInput');
            const user = userInput.value.trim() || '匿名';
            const message = msgInput.value.trim();

            if (!message || !ws || ws.readyState !== WebSocket.OPEN) return;

            ws.send(JSON.stringify({ user, message }));
            msgInput.value = '';
            msgInput.focus();
        }
    </script>

</body>
</html>
