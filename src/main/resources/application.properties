spring.application.name=stock-observation

# server port
server.port=8080

# R2DBC PostgreSQL
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/stockdb
spring.r2dbc.username=postgres
spring.r2dbc.password=123456
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=20

# log
logging.level.org.springframework.data.r2dbc=DEBUG
logging.level.io.r2dbc.postgresql=DEBUG

# WebFlux
spring.webflux.base-path=/api

# Finnhub API Key
finnhub.api-key=d8cqgvpr01qt0j1hualgd8cqgvpr01qt0j1huam0

# Writable storage directory for videos uploaded via the admin page
app.video.upload-dir=uploads/videos

# Multipart upload limits (allow larger video files)
spring.webflux.multipart.max-in-memory-size=1MB
spring.webflux.multipart.max-disk-usage-per-part=2GB

